<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nathan's Projects</title>
  <style>
    :root {
      --bg: #0f1115;
      --card: #1a1d24;
      --text: #e8eaed;
      --muted: #9aa0a8;
      --accent: #6ea8fe;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .container { max-width: 900px; margin: 0 auto; padding: 4rem 1.5rem; }
    header { margin-bottom: 3rem; }
    h1 { font-size: 2.2rem; margin-bottom: 0.5rem; }
    header p { color: var(--muted); font-size: 1.1rem; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.25rem;
    }
    .card {
      display: block;
      background: var(--card);
      border: 1px solid #2a2e38;
      border-radius: 12px;
      padding: 1.5rem;
      text-decoration: none;
      color: inherit;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    .card:hover { transform: translateY(-3px); border-color: var(--accent); }
    .card h2 { font-size: 1.15rem; margin-bottom: 0.4rem; color: var(--accent); }
    .card p { color: var(--muted); font-size: 0.95rem; line-height: 1.5; }
    footer { margin-top: 4rem; color: var(--muted); font-size: 0.9rem; }
    footer a { color: var(--accent); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Nathan's Projects</h1>
      <p>A collection of small HTML experiments and projects.</p>
    </header>

    <!-- To add a project: copy a card below, change the folder name, title, and description.
         Each project lives in its own folder with an index.html inside. -->
    <main class="grid">
      <a class="card" href="example-project/">
        <h2>Example Project</h2>
        <p>A starter project page. Replace this with your first real project.</p>
      </a>
    </main>

    <footer>
      <p>Built by Nathan &middot; Hosted on <a href="https://pages.github.com">GitHub Pages</a></p>
    </footer>
  </div>
</body>
</html>
