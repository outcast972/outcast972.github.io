<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nathan's Property Tracker</title>
<style>
  :root {
    --green:  #d4edda;
    --green-border: #28a745;
    --yellow: #fff3cd;
    --yellow-border: #ffc107;
    --orange: #ffe0cc;
    --orange-border: #e8612c;
    --blue-dark: #1F4E79;
    --blue-mid:  #2e75b6;
    --blue-light: #dce8f5;
    --text: #1a1a2e;
    --muted: #6b7280;
    --card-radius: 12px;
    --shadow: 0 2px 8px rgba(0,0,0,0.10);
    --shadow-hover: 0 6px 20px rgba(0,0,0,0.18);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f0f4f8;
    color: var(--text);
    min-height: 100vh;
  }

  /* ── Header ──────────────────────────────────────────────────── */
  header {
    background: var(--blue-dark);
    color: white;
    padding: 24px 32px 20px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(0,0,0,0.25);
  }
  header h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.3px; }
  header p  { font-size: 0.82rem; opacity: 0.75; margin-top: 2px; }

  .header-inner { display: flex; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; gap: 12px; }

  .legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 2px; }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 0.75rem; opacity: 0.9; }
  .legend-dot { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }
  .legend-dot.viewing  { background: var(--orange-border); }
  .legend-dot.budget   { background: var(--green-border); }
  .legend-dot.over     { background: var(--yellow-border); }

  /* ── Filter bar ──────────────────────────────────────────────── */
  .filter-bar {
    background: white;
    padding: 14px 32px;
    display: flex;
    gap: 20px;
    align-items: center;
    flex-wrap: wrap;
    border-bottom: 1px solid #e5e7eb;
    position: sticky;
    top: 83px;
    z-index: 99;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .filter-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .filter-label { font-size: 0.75rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap; }

  .filter-btn {
    border: 1.5px solid #d1d5db;
    background: white;
    border-radius: 20px;
    padding: 5px 14px;
    font-size: 0.8rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    color: var(--text);
    white-space: nowrap;
  }
  .filter-btn:hover { border-color: var(--blue-mid); color: var(--blue-mid); }
  .filter-btn.active { background: var(--blue-dark); border-color: var(--blue-dark); color: white; }

  .count-badge {
    background: var(--blue-light);
    color: var(--blue-dark);
    font-size: 0.75rem;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 20px;
    margin-left: auto;
  }

  /* ── Search box ──────────────────────────────────────────────── */
  .search-wrap { position: relative; }
  .search-wrap input {
    border: 1.5px solid #d1d5db;
    border-radius: 20px;
    padding: 5px 14px 5px 32px;
    font-size: 0.8rem;
    outline: none;
    transition: border-color 0.15s;
    width: 180px;
    color: var(--text);
  }
  .search-wrap input:focus { border-color: var(--blue-mid); }
  .search-wrap::before {
    content: '🔍';
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 0.7rem;
    pointer-events: none;
  }

  /* ── Grid ────────────────────────────────────────────────────── */
  .grid-wrap { padding: 24px 32px 48px; }

  .area-section { margin-bottom: 32px; }
  .area-heading {
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--blue-dark);
    margin-bottom: 14px;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--blue-light);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .area-heading .area-count {
    font-size: 0.75rem;
    font-weight: 600;
    background: var(--blue-light);
    color: var(--blue-mid);
    padding: 2px 8px;
    border-radius: 10px;
  }

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 16px;
  }

  /* ── Card ────────────────────────────────────────────────────── */
  .card {
    background: white;
    border-radius: var(--card-radius);
    overflow: hidden;
    box-shadow: var(--shadow);
    border: 2.5px solid transparent;
    transition: transform 0.15s, box-shadow 0.15s;
    display: flex;
    flex-direction: column;
  }
  .card:hover { transform: translateY(-3px); box-shadow: var(--shadow-hover); }

  .card.viewing { border-color: var(--orange-border); background: #fffaf7; }
  .card.in-budget { border-color: var(--green-border); }
  .card.over-budget { border-color: var(--yellow-border); }

  /* ── Card image ──────────────────────────────────────────────── */
  .card-img-wrap {
    position: relative;
    width: 100%;
    height: 185px;
    background: #e9eef4;
    overflow: hidden;
    flex-shrink: 0;
  }
  .card-img-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.3s;
  }
  .card:hover .card-img-wrap img { transform: scale(1.04); }
  .card-img-wrap .no-img {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #9ca3af;
    font-size: 0.8rem;
    gap: 8px;
  }
  .card-img-wrap .no-img .icon { font-size: 2rem; }

  /* ── Status ribbon ───────────────────────────────────────────── */
  .status-ribbon {
    position: absolute;
    top: 10px;
    right: 10px;
    padding: 3px 9px;
    border-radius: 6px;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.3px;
  }
  .ribbon-viewing  { background: var(--orange-border); color: white; }
  .ribbon-budget   { background: #198754; color: white; }
  .ribbon-over     { background: #856404; color: #fff8e1; }

  /* ── Card body ───────────────────────────────────────────────── */
  .card-body {
    padding: 14px 16px 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 1;
  }

  .card-address {
    font-size: 0.9rem;
    font-weight: 700;
    color: var(--text);
    line-height: 1.3;
  }

  .card-type {
    display: inline-block;
    background: var(--blue-light);
    color: var(--blue-dark);
    font-size: 0.68rem;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 4px;
    width: fit-content;
  }

  .card-rent {
    font-size: 1.3rem;
    font-weight: 800;
    color: var(--blue-dark);
    letter-spacing: -0.5px;
    margin-top: 2px;
  }
  .card-rent span { font-size: 0.75rem; font-weight: 400; color: var(--muted); }

  .card-meta {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 2px;
  }
  .meta-chip {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 0.75rem;
    color: var(--muted);
  }
  .meta-chip .icon { font-size: 0.85rem; }

  .card-transport {
    background: #f8fafc;
    border: 1px solid #e5e7eb;
    border-radius: 7px;
    padding: 7px 10px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    margin-top: 2px;
  }
  .transport-row {
    display: flex;
    align-items: flex-start;
    gap: 6px;
    font-size: 0.74rem;
    color: #374151;
  }
  .transport-row .t-icon { font-size: 0.85rem; flex-shrink: 0; margin-top: 1px; }
  .transport-row .t-label { color: var(--muted); font-weight: 600; min-width: 28px; }

  .card-notes {
    font-size: 0.73rem;
    color: var(--muted);
    line-height: 1.4;
    border-left: 3px solid var(--blue-light);
    padding-left: 8px;
    margin-top: 2px;
  }
  .card-notes.viewing-note {
    border-left-color: var(--orange-border);
    color: #92400e;
    background: #fff7ed;
    padding: 5px 8px;
    border-radius: 0 5px 5px 0;
  }

  .card-footer {
    padding: 0 16px 14px;
    margin-top: auto;
  }
  .card-link {
    display: block;
    width: 100%;
    text-align: center;
    background: var(--blue-dark);
    color: white;
    text-decoration: none;
    padding: 8px;
    border-radius: 8px;
    font-size: 0.8rem;
    font-weight: 600;
    transition: background 0.15s;
  }
  .card-link:hover { background: var(--blue-mid); }
  .card-link.viewing-link { background: var(--orange-border); }
  .card-link.viewing-link:hover { background: #c44e1e; }

  /* ── Empty state ─────────────────────────────────────────────── */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    font-size: 0.9rem;
    grid-column: 1/-1;
  }
  .empty-state .e-icon { font-size: 2.5rem; margin-bottom: 8px; }

  /* ── Hidden ──────────────────────────────────────────────────── */
  .hidden { display: none !important; }
  .area-section.hidden { display: none !important; }

  @media (max-width: 600px) {
    header, .filter-bar, .grid-wrap { padding-left: 16px; padding-right: 16px; }
    .filter-bar { top: 72px; }
    .cards { grid-template-columns: 1fr; }
  }
</style>
</head>

const AREAS = [...new Set(PROPERTIES.map(p => p.area))];
let activeArea   = 'all';
let activeStatus = 'all';
let searchText   = '';

function filterArea(btn) {
  document.querySelectorAll('[data-area]').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeArea = btn.dataset.area;
  render();
}
function filterStatus(btn) {
  document.querySelectorAll('[data-status]').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeStatus = btn.dataset.status;
  render();
}
function filterSearch() {
  searchText = document.getElementById('searchBox').value.toLowerCase();
  render();
}

function matches(p) {
  if (activeArea !== 'all' && p.area !== activeArea) return false;
  if (activeStatus === 'viewing' && p.viewing !== 'Yes') return false;
  if (activeStatus === 'budget' && !(p.rent >= 900 && p.rent <= 1200)) return false;
  if (searchText && !p.address.toLowerCase().includes(searchText) && !p.area.toLowerCase().includes(searchText)) return false;
  return true;
}

function buildCard(p) {
  const inBudget = p.rent >= 900 && p.rent <= 1200;
  const isViewing = p.viewing === 'Yes';
  const t = TRANSPORT[p.area];
  const imgUrl = IMG_MAP[p.id];

  let cardClass = 'card';
  if (isViewing) cardClass += ' viewing';
  else if (inBudget) cardClass += ' in-budget';
  else cardClass += ' over-budget';

  let ribbonClass = isViewing ? 'ribbon-viewing' : (inBudget ? 'ribbon-budget' : 'ribbon-over');
  let ribbonText  = isViewing ? '👀 Viewing' : (inBudget ? '✅ In budget' : '⚠️ Over budget');

  const imgHtml = imgUrl
    ? `<img src="${imgUrl}" alt="${p.address}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=\\'no-img\\'><div class=\\'icon\\'>🏠</div><span>No photo available</span></div>'">`
    : `<div class="no-img"><div class="icon">🏠</div><span>No photo available</span></div>`;

  const viewingNoteHtml = isViewing && p.userNote
    ? `<div class="card-notes viewing-note">📌 ${p.userNote}</div>`
    : '';

  const linkClass = isViewing ? 'card-link viewing-link' : 'card-link';
  const linkText  = isViewing ? '🏠 View on Rightmove (viewing scheduled)' : '🔗 View on Rightmove';

  return `
    <div class="${cardClass}">
      <div class="card-img-wrap">
        ${imgHtml}
        <span class="status-ribbon ${ribbonClass}">${ribbonText}</span>
      </div>
      <div class="card-body">
        <div class="card-address">${p.address}</div>
        <span class="card-type">${p.type}</span>
        <div class="card-rent">£${p.rent.toLocaleString()}<span>/mo</span></div>
        <div class="card-meta">
          <span class="meta-chip"><span class="icon">🛏</span> ${p.beds} bed</span>
          <span class="meta-chip"><span class="icon">🚿</span> ${p.baths} bath</span>
        </div>
        <div class="card-transport">
          <div class="transport-row"><span class="t-icon">🚆</span><span class="t-label">Brum</span>${t.train}</div>
          <div class="transport-row"><span class="t-icon">🚗</span><span class="t-label">Derby</span>${t.drive}</div>
        </div>
        <div class="card-notes">${p.notes}</div>
        ${viewingNoteHtml}
      </div>
      <div class="card-footer">
        <a href="${p.link}" target="_blank" class="${linkClass}">${linkText}</a>
      </div>
    </div>`;
}

function render() {
  const wrap = document.getElementById('gridWrap');
  let totalShown = 0;
  let html = '';

  for (const area of AREAS) {
    const props = PROPERTIES.filter(p => p.area === area && matches(p));
    if (props.length === 0) continue;
    totalShown += props.length;
    html += `
      <div class="area-section">
        <div class="area-heading">
          📍 ${area}
          <span class="area-count">${props.length} listing${props.length !== 1 ? 's' : ''}</span>
        </div>
        <div class="cards">
          ${props.map(buildCard).join('')}
        </div>
      </div>`;
  }

  if (totalShown === 0) {
    html = `<div class="empty-state"><div class="e-icon">🔍</div><p>No properties match your filters.</p></div>`;
  }

  wrap.innerHTML = html;
  document.getElementById('countBadge').textContent = `${totalShown} ${totalShown === 1 ? 'property' : 'properties'}`;
}

render();
</script>
</body>
</html>
